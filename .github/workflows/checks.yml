name: Project checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m pip install --only-binary=:all: -r requirements-quantum.txt
      - name: Test without frontend dependencies or build output
        run: |
          test ! -d frontend/node_modules
          test ! -d frontend/dist
          python -m pytest -q

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m scripts.export_contracts --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: npm --prefix frontend ci --ignore-scripts
      - run: python -m pip install --only-binary=:all: -r requirements-quantum.txt
      - run: npm --prefix frontend run build
      - name: Install the pinned Playwright browser
        working-directory: frontend
        run: npx --no-install playwright-core install --with-deps chromium
      - run: npm --prefix frontend run test:integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: frontend/test-results/
